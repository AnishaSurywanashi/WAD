<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
       <div class="card p-4 shadow">
        <h3 class="text-center fw-bold text-success">Event Registration Form</h3>
        <p class="text-center text-muted">Please fill out the form below to register for the event.</p>
         <form class="needs-validation" novalidate>
            <!-- Name -->
             <div class="form-floating mb-3"></div>
              <label for="name">Name</label>
             <input type ="name" class="form-control mt-3" id="name" placeholder="Name" required>
            
             <div class="invalid-feedback">Please enter your name.</div>

            <!-- Email -->
             <div class="form-floating mb-3"></div>
              <label for="email">Email</label>
             <input type="email" class="form-control mt-3" id="email" placeholder="Email" required>
            
             <div class="invalid-feedback">Please enter a valid email address.</div>

            <!-- Phone -->
             <div class="form-floating mb-3"></div>
             <label for="phone">Phone</label>
             <input type="tel" class="form-control mb-3" id="phone" placeholder="Phone"
             pattern="[0-9]{10}" required>
             
             <div class="invalid-feedback">Please enter a valid phone number.</div>

             <!-- Event -->
              <div class="mb-3">
                <label class="form-label mt-3">Select Event</label>
                <select class="form-select"" required>
                    <option value="">Choose an event..</option>
                    <option >Workshop</option>
                    <option >Seminar</option>
                    <option >Networking</option>
                    <option>Hackathon</option>
                </select>
              </div>
            <button class="btn btn-success w-100" type="submit">Register</button>
         </form>
       </div>

        
    </div>
    <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- External JS -->
<script src="script.js"></script>
