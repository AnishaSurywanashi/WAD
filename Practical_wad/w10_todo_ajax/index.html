<!DOCTYPE html>
<html>
<head>
    <title>To-Do List (AJAX)</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f0f0;
        }

        .container {
            background: white;
            padding: 20px;
            width: 300px;
            margin: 50px auto;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            width: 70%;
        }

        button {
            padding: 8px;
            margin: 5px;
        }

        li {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 To-Do List</h2>

    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
