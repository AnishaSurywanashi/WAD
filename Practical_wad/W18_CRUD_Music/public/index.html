<!DOCTYPE html>
<html>
<head>
    <title>Music App</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
            width: 90%;
            background: white;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background: #333;
            color: white;
        }
        button {
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>

<h2>🎵 Music Database</h2>

<button onclick="loadData()">Load Songs</button>

<table>
    <thead>
        <tr>
            <th>Song</th>
            <th>Film</th>
            <th>Director</th>
            <th>Singer</th>
            <th>Actor</th>
            <th>Actress</th>
        </tr>
    </thead>
    <tbody id="data"></tbody>
</table>

<script>
async function loadData() {
    const res = await fetch("/songs");
    const data = await res.json();

    let rows = "";
    data.songs.forEach(s => {
        rows += `
            <tr>
                <td>${s.songname}</td>
                <td>${s.film}</td>
                <td>${s.music_director}</td>
                <td>${s.singer}</td>
                <td>${s.actor || "-"}</td>
                <td>${s.actress || "-"}</td>
            </tr>
        `;
    });

    document.getElementById("data").innerHTML = rows;
}
</script>

</body>
</html>
