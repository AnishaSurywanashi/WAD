<!DOCTYPE html>
<html>
<head>
    <title>Employee Directory</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        img {
            height: 150px;
            object-fit: cover;
            
        }
        .salary {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="text-center my-4">👨‍💼 Employee Directory</h2>
    <div class="row" id="empList"></div>
</div>

<script>
fetch("/api/employees")
.then(res => res.json())
.then(data => {
    const container = document.getElementById("empList");

    data.forEach(emp => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";

        col.innerHTML = `
            <div class="card p-3 text-center">
                <img src="${emp.image}" class="img-fluid rounded mb-2">
                <h5>${emp.name}</h5>
                <p>${emp.designation}</p>
                <p>${emp.department}</p>
                <p class="salary">₹${emp.salary}</p>
            </div>
        `;

        container.appendChild(col);
    });
})
.catch(err => console.log(err));
</script>

</body>
</html>
