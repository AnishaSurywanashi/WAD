<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial;
        }

        .navbar {
            background-color: #3b5998;
        }

        .navbar input {
            height: 30px;
        }

        .left-text {
            margin-top: 50px;
        }

        .signup-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .btn-signup {
            background-color: #42b72a;
            color: white;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand fs-3 fw-bold text-white">Facebook</span>

    <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Email">
        <input class="form-control me-2" type="password" placeholder="Password">
        
        <button class="btn btn-light">Login</button>
    </form>
</nav>

<!--Main Section-->
<div class = "container mt-5">
    <div class="row">
        <div class ="col-md-6 left text">
            <h4>Facebook is useless without friends.</h4>
            <h5>Make More Friends.</h5>
            <p class="mt-3">
                Facebook helps you connect and share with people in your life.
            </p>
            <img src="https://picsum.photos/400/200" class="img-fluid mt-3" style="height: 250px; object-fit: cover;">
        </div>

        <div class="col-md-6 right text ">
            <div class="signup-box shadow">
                <h5> Create a New Account</h5>
                <p>It's free and always will be available</p>
                <div class="row mt-3">
                    <div class="col">
                        <input type="text" class="form-control" placeholder="First Name">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Last Name" >
                    </div>
                </div>
                <input type="email" class="form-control mt-2" placeholder="Email">
                <input type="email" class="form-control mt-2" placeholder="Re-enter Email">
                <input type="password" class="form-control mt-2" placeholder="Password">
                <input type="date" class="form-control mt-2" placeholder="Date of Birth">
      
                <!-- Gender -->
                <div class="mt-2 ">
                    <input type="radio"> Male
                    <input type="radio" class="ms-3"> Female
                </div>
                  <small  class="text-muted mt-3">
                    By clicking Sign Up, you agree to our Terms.
                </small>
                <button class="btn btn-signup w-100 mt-3">Sign Up</button>
                
            </div>
        </div>
    </div>

</div>

</body>
</html>
