<div class="container">
 <div class="card shadow-box">
   <h2>Todo List</h2>

  <input [(ngModel)]="taskInput" placeholder="Enter task">

  <!-- ADD BUTTON -->
  <button (click)="addTask()" *ngIf="editIndex === null">Add</button>

  <!-- UPDATE BUTTON -->
  <button (click)="updateTask()" *ngIf="editIndex !== null">Update</button>

  <ul>
    <li *ngFor="let task of tasks; let i = index">
      {{ task.name }}
      <button (click)="editTask(i)">Edit</button>
      <button (click)="deleteTask(i)">Delete</button>
    </li>
  </ul>
 </div>
</div>
