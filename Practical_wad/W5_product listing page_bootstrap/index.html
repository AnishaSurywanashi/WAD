<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container   ">
        <span class="navbar-brand">🛍 ShopEase</span>
    </div>
</nav>

<!-- Heading -->
<div class="container text-center my-4">
    <h2>Product Listing</h2>
</div>

<div class="container">

    <!-- Filter -->
    <div class="d-flex justify-content-end mb-3">
        <select class="form-select w-auto" id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="mug">Mugs</option>
            <option value="tshirt">T-Shirts</option>
            <option value="bottle">Bottles</option>
            <option value="bag">Bags</option>
            <option value="shoes">Shoes</option>
        </select>
    </div>

    <!-- Products -->
    <div class="row g-4">

        <!-- 1 -->
        <div class="col-md-3 product" data-category="mug">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=1">
                <div class="card-body">
                    <h6>Ceramic Mug</h6>
                    <p class="price">₹299</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- 2 -->
        <div class="col-md-3 product" data-category="tshirt">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=2">
                <div class="card-body">
                    <h6>T-Shirt</h6>
                    <p class="price">₹599</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- 3 -->
        <div class="col-md-3 product" data-category="bottle">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=3">
                <div class="card-body">
                    <h6>Water Bottle</h6>
                    <p class="price">₹199</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- 4 -->
        <div class="col-md-3 product" data-category="bag">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=4">
                <div class="card-body">
                    <h6>Backpack</h6>
                    <p class="price">₹899</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- 5 -->
        <div class="col-md-3 product" data-category="shoes">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=5">
                <div class="card-body">
                    <h6>Shoes</h6>
                    <p class="price">₹1299</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- NEW 6 -->
        <div class="col-md-3 product" data-category="mug">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=6">
                <div class="card-body">
                    <h6>Printed Mug</h6>
                    <p class="price">₹349</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- NEW 7 -->
        <div class="col-md-3 product" data-category="tshirt">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=7">
                <div class="card-body">
                    <h6>Casual T-Shirt</h6>
                    <p class="price">₹499</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- NEW 8 -->
        <div class="col-md-3 product" data-category="bottle">
            <div class="card text-center">
                <img src="https://picsum.photos/300/200?random=8">
                <div class="card-body">
                    <h6>Steel Bottle</h6>
                    <p class="price">₹299</p>
                    <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Footer -->
<footer class="text-center mt-4 p-2 bg-light">
    <small>© 2026 ShopEase</small>
</footer>

<script src="script.js"></script>
</body>
</html>
