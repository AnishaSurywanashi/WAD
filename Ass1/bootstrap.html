<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RoomFinder | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS :- used using CDN And this is external Bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- container-fluid :- used for the adding the limit to container-->
<div class="container-fluid bg-light min-vh-100 d-flex justify-content-center align-items-center">

    <!-- container -->
    <div class="container">

        <!-- card -->
        <div class="card mx-auto shadow" style="max-width: 400px;">

            <!-- card-body -->
            <div class="card-body">

                <!-- card-title -->
                <h3 class="card-title text-center mb-2">Login</h3>

                <!-- card-text -->
                <p class="card-text text-center text-muted mb-4">
                    Login to access RoomFinder
                </p>

                <!-- Login Form -->
                <form>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter password">
                    </div>

                    <!-- btn & btn-primary -->
                    <button type="submit" class="btn btn-primary w-100 mb-2">
                        Login
                    </button>

                    <!-- btn  -->
                    <button type="reset" class="btn btn-outline-primary w-100">
                        Clear
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
